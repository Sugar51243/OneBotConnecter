name: Publish Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build release distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Verify wheel imports from a clean environment
        run: |
          python -m venv .venv-package-check
          . .venv-package-check/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "import importlib, pkgutil, OneBotConnecter; modules = [OneBotConnecter.__name__] + [module.name for module in pkgutil.walk_packages(OneBotConnecter.__path__, OneBotConnecter.__name__ + '.')] ; [importlib.import_module(module) for module in modules]; print(f'Imported {len(modules)} OneBotConnecter modules')"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: read

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi
      # OPTIONAL: uncomment and update to include your PyPI project URL in the deployment status:
      url: https://pypi.org/p/OneBotConnecter
      #
      # ALTERNATIVE: if your GitHub Release name is the PyPI project version string
      # ALTERNATIVE: exactly, uncomment the following line instead:
      # url: https://pypi.org/project/OneBotConnecter/${{ github.event.release.name }}

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
